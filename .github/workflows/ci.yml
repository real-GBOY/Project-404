name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (core + mizan)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      AURIC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/auric_test
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format check
        run: npm run format:check

      - name: test (unit + integration + tenant isolation)
        run: npm test

      - name: production build
        run: npm run build

  web:
    name: mizan/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mizan/web/package-lock.json

      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mizan-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment: every push to main that passes the checks above is
  # built here and shipped to the VPS over SSH. The box compiles nothing — it
  # gets the finished `dist/` + the web bundle, installs prod deps for its own
  # architecture, and restarts the service (migrations run on boot).
  #
  # Required repo secrets:  VPS_SSH_KEY  VPS_HOST  VPS_USER
  # Optional repo secrets:  VPS_SSH_KNOWN_HOSTS
  # Optional repo variables: VPS_BACKEND_DIR (/opt/mizan)  VPS_WEB_ROOT (/var/www/mizan)
  #                          VPS_SERVICE (mizan)  VPS_PORT (3000)
  # See docs/deployment.md.
  deploy:
    name: deploy to VPS
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      VPS_BACKEND_DIR: ${{ vars.VPS_BACKEND_DIR || '/opt/mizan' }}
      VPS_WEB_ROOT: ${{ vars.VPS_WEB_ROOT || '/var/www/mizan' }}
      VPS_SERVICE: ${{ vars.VPS_SERVICE || 'mizan' }}
      VPS_PORT: ${{ vars.VPS_PORT || '3000' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build backend
        run: |
          npm ci
          npm run build

      - name: Build web bundle
        working-directory: mizan/web
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_SSH_KNOWN_HOSTS not set — trusting the host key on first contact (TOFU)"
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      # The box has no rsync and the service runs as its own user, so ship two
      # tar streams over ssh and swap the directory contents with sudo + coreutils
      # (see docs/deployment.md for the sudoers entry). SERVICE / PORT ride along
      # in deploy.env, not on the sudo command line, so the sudoers rule stays exact.
      - name: Ship build to the box
        run: |
          printf 'SERVICE=%s\nPORT=%s\n' "$VPS_SERVICE" "$VPS_PORT" > deploy.env
          tar -czf - -C dist . | ssh vps "cat > /tmp/mizan-backend.tgz"
          tar -czf - -C mizan/web/dist . | ssh vps "cat > /tmp/mizan-web.tgz"
          scp package.json package-lock.json scripts/deploy-vps.sh deploy.env vps:/tmp/

      - name: Release
        run: |
          ssh vps "set -e
            sudo mkdir -p '$VPS_BACKEND_DIR/dist' '$VPS_WEB_ROOT'
            sudo find '$VPS_BACKEND_DIR/dist' -mindepth 1 -delete
            sudo tar --no-same-owner -xzf /tmp/mizan-backend.tgz -C '$VPS_BACKEND_DIR/dist'
            sudo cp /tmp/package.json /tmp/package-lock.json /tmp/deploy-vps.sh /tmp/deploy.env '$VPS_BACKEND_DIR/'
            sudo find '$VPS_WEB_ROOT' -mindepth 1 -delete
            sudo tar --no-same-owner -xzf /tmp/mizan-web.tgz -C '$VPS_WEB_ROOT'
            rm -f /tmp/mizan-backend.tgz /tmp/mizan-web.tgz /tmp/package.json /tmp/package-lock.json /tmp/deploy-vps.sh /tmp/deploy.env
            sudo bash '$VPS_BACKEND_DIR/deploy-vps.sh'
            sudo systemctl reload nginx || true
          "
