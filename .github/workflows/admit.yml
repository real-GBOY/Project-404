name: Admit

# Admit's checks run on every push and pull request that touches Admit or the Core source it compiles. Nothing here deploys
# (the API is shipped with scripts/deploy-admit-local.sh; the web app deploys from Vercel).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["admit/**", "core/**", "packages/**", "package-lock.json", ".github/workflows/admit.yml"]
  pull_request:
    paths: ["admit/**", "core/**", "packages/**", "package-lock.json", ".github/workflows/admit.yml"]

concurrency:
  group: admit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: admit/backend
    runs-on: ubuntu-latest

    # PostgreSQL 12 on purpose: it is the production major version of the shared box.
    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      AURIC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/admit_test
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Dependencies live at the repo root (admit/backend has none of its own).
      - run: npm ci
      - name: typecheck · lint · format · test · build
        working-directory: admit/backend
        run: npm run ci

  web:
    name: admit/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admit/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admit/web/package-lock.json

      - run: npm ci
      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  worker:
    name: admit/worker (email)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      ADMIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/admit_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The worker's tests run against a real Admit schema: create it with the backend's own migrations.
      - run: npm ci
      - name: create the admit_test schema
        working-directory: admit/backend
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE admit_test"
          AURIC_DATABASE_URL=$ADMIT_TEST_DATABASE_URL npm run migrate
      - name: pytest
        working-directory: admit/worker
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  e2e:
    name: admit/e2e (real browser, real backend)
    runs-on: ubuntu-latest
    needs: [backend, web]

    services:
      postgres:
        image: postgres:12-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admit/web/package-lock.json
      - name: install (root: the backend runs from it)
        run: npm ci
      - name: install (web)
        working-directory: admit/web
        run: npm ci
      - name: Chrome
        uses: browser-actions/setup-chrome@v1
      - name: e2e
        working-directory: admit/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admit-e2e-report
          path: |
            admit/web/playwright-report
            admit/web/test-results
