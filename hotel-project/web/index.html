<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotel Nayel — Your Gateway to Serenity</title>
    <meta
      name="description"
      content="Hotel Nayel — a calm boutique hotel on the Nile in Cairo, with rooftop pool, spa, dining and event spaces. Book your stay directly for the best rate."
    />
    <meta name="theme-color" content="#f9f6f3" />
    <!-- __SITE_URL__ is filled in at build time (see vite.config.ts); empty in local dev. -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hotel Nayel" />
    <meta property="og:title" content="Hotel Nayel — Your Gateway to Serenity" />
    <meta
      property="og:description"
      content="A calm boutique hotel on the Nile in Cairo. Sunlit rooms, rooftop pool, spa and dining — book direct for the best rate."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hotel Nayel — grand hall with crystal chandeliers" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/hero.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
